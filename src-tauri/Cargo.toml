[package]
name = "wt-8111-neo"
version = "0.1.0"
description = "WT 8111 Neo portable local web service"
authors = ["WT 8111 Neo"]
edition = "2021"

[dependencies]
axum = "0.8"
mime_guess = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["cors"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
