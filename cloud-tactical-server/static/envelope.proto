syntax = "proto3";

package wt8111;

import "observation.proto";
import "snapshot.proto";

// WebSocket 二进制消息信封
// 所有 WS 消息都用此信封包装，payload 由 oneof 区分类型
message WsEnvelope {
  oneof payload {
    // relay → server: 上传观测帧
    ObservationFrame observation = 1;

    // server → viewer: 下发融合快照
    FusedSnapshot snapshot = 2;

    // relay → server: 加入房间请求
    JoinRequest join_request = 3;

    // server → relay: 加入房间响应
    JoinResponse join_response = 4;

    // 双向: 错误响应
    ErrorResponse error = 5;

    // 双向: 确认
    Ack ack = 6;

    // server → relay: 请求重发 keyframe
    RequestKeyframe request_keyframe = 7;

    // relay → server: 心跳
    Ping ping = 8;

    // server → relay: 心跳响应
    Pong pong = 9;
  }
}

// 加入房间请求
message JoinRequest {
  string room_id = 1;
  string password = 2;          // 房间密码
  string client_id = 3;         // 客户端标识
  string player_name = 4;       // 玩家名称
  uint32 protocol_version = 5;  // 客户端协议版本
}

// 加入房间响应
message JoinResponse {
  bool accepted = 1;
  string session_id = 2;        // 服务端分配的会话 ID
  uint32 server_protocol_version = 3;
  string error_message = 4;     // 如果 accepted=false
  uint64 server_time_ms = 5;    // 服务端毫秒时间戳 (用于时钟同步)
}

// 错误响应
message ErrorResponse {
  uint32 code = 1;
  string message = 2;
}

// 确认
message Ack {
  uint64 seq = 1;               // 确认的帧序号
}

// 请求重发 keyframe
message RequestKeyframe {
  string reason = 1;
}

// 心跳
message Ping {
  uint64 client_time_ms = 1;
}

// 心跳响应
message Pong {
  uint64 client_time_ms = 1;
  uint64 server_time_ms = 2;
}
