version: "3.9"

services:
  cloud-tactical-server:
    build: .
    container_name: wt8111-tactical
    restart: unless-stopped
    ports:
      - "17712:17712"
    environment:
      - RUST_LOG=cloud_tactical_server=info,tower_http=info
    volumes:
      - ./config/server.yaml:/app/config/server.yaml:ro
    # 健康检查
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:17712/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

